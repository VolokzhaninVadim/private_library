services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - ./config_calibre:/config
      - /mnt/media/books/books:/calibre-library
      - /mnt/media/books/new_books:/cwa-book-ingest
    ports:
      - "8084:8083"
    restart: unless-stopped